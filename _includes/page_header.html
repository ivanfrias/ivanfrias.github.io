<div class="header-content-wrapper">
	<div class="hero-bg-image" aria-hidden="true"></div>
	<canvas id="hero-waveform-canvas" class="hero-waveform-bg" aria-hidden="true"></canvas>
	<div class="hero-vignette" aria-hidden="true"></div>
	<div class="container header-container">
		<div class="hero-tag-badge">
			<span class="pulse-indicator"></span> Code &bull; Gaming &bull; Tech &bull; Audio
		</div>
		<div class="brand-logo-lockup">
			<a href="{{ "/" | relative_url }}" class="logo-link" title="Ivan Frias">
				<div class="logo-name-mark">
					<svg class="logo-name-svg" viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
						<defs>
							<linearGradient id="brandPillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
								<stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
								<stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
							</linearGradient>
							<linearGradient id="brandNameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#38bdf8"/>
								<stop offset="50%" stop-color="#818cf8"/>
								<stop offset="100%" stop-color="#c084fc"/>
							</linearGradient>
							<filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
								<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.35"/>
							</filter>
						</defs>
						<rect x="2" y="2" width="276" height="52" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="url(#brandPillBorder)" stroke-width="2.2" />
						<text x="32" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">Ivan</text>
						<text x="100" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.03em" fill="url(#brandNameGrad)" filter="url(#brandGlow)">Frias</text>
						<circle cx="236" cy="28" r="3" fill="#38bdf8" opacity="0.8"/>
						<circle cx="248" cy="28" r="3" fill="#818cf8" opacity="0.6"/>
						<circle cx="260" cy="28" r="3" fill="#c084fc" opacity="0.4"/>
					</svg>
				</div>
				<h1 class="brand-heading sr-only">{{ site.texture.title }}</h1>
			</a>
		</div>
		<h2>{{ site.texture.tagline }}</h2>
		<ul class="social">
			{%- if site.texture.social_links.github -%}
				<a href="https://github.com/{{ site.texture.social_links.github }}" title="GitHub"><li><i class="icon-github-circled"></i></li></a>
			{%- endif -%}
			{%- if site.texture.social_links.linkedIn -%}
				<a href="https://linkedin.com/{{ site.texture.social_links.linkedIn }}" title="LinkedIn"><li><i class="icon-linkedin-squared"></i></li></a>
			{%- endif -%}
			{%- if site.texture.social_links.twitter -%}
				<a href="https://twitter.com/{{ site.texture.social_links.twitter }}" title="Twitter"><li><i class="icon-twitter-squared"></i></li></a>
			{%- endif -%}
		</ul>
	</div>
</div>
<script src="{{ "/assets/js/audio-waves.js" | relative_url }}"></script>
