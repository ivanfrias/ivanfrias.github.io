<div class="header-content-wrapper">
	<div class="hero-bg-image" aria-hidden="true"></div>
	<canvas id="hero-waveform-canvas" class="hero-waveform-bg" aria-hidden="true"></canvas>
	<div class="hero-vignette" aria-hidden="true"></div>
	<div class="container header-container">
		<div class="brand-row">
			<div class="hero-tag-badge">
				<span class="pulse-indicator"></span> Code &bull; Gaming &bull; Tech &bull; Audio
			</div>
		</div>
		<h1 class="header-title">{{ site.texture.title }}</h1>
		<h2>{{ site.texture.tagline }}</h2>
		<ul class="social">
			{%- if site.texture.social_links.github -%}
				<a href="https://github.com/{{ site.texture.social_links.github }}" title="GitHub"><li><i class="icon-github-circled"></i></li></a>
			{%- endif -%}
			{%- if site.texture.social_links.linkedIn -%}
				<a href="https://linkedin.com/{{ site.texture.social_links.linkedIn }}" title="LinkedIn"><li><i class="icon-linkedin-squared"></i></li></a>
			{%- endif -%}
			{%- if site.texture.social_links.twitter -%}
				<a href="https://twitter.com/{{ site.texture.social_links.twitter }}" title="Twitter"><li><i class="icon-twitter-squared"></i></li></a>
			{%- endif -%}
		</ul>
	</div>
</div>
<script src="{{ "/assets/js/audio-waves.js" | relative_url }}"></script>
