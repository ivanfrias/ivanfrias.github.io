<svg viewBox="0 0 280 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glass Pill Border Gradient -->
    <linearGradient id="brandPillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glowing Text Fill Gradient for Frias -->
    <linearGradient id="brandNameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Translucent Frosted Badge Pill -->
  <rect x="2" y="2" width="276" height="52" rx="14" 
        fill="rgba(15, 23, 42, 0.75)" 
        stroke="url(#brandPillBorder)" 
        stroke-width="2.2" />

  <!-- Clean Precision Typography Inside the Badge -->
  <!-- "Ivan" in Crisp Pure White -->
  <text x="32" y="36" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="25" 
        font-weight="800" 
        letter-spacing="-0.03em" 
        fill="#ffffff">Ivan</text>

  <!-- "Frias" in Vivid Electric Cyan-to-Purple Gradient -->
  <text x="100" y="36" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="-0.03em" 
        fill="url(#brandNameGrad)" 
        filter="url(#brandGlow)">Frias</text>

  <!-- Right Decorative Geometric Accent Dots -->
  <circle cx="236" cy="28" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="248" cy="28" r="3" fill="#818cf8" opacity="0.6"/>
  <circle cx="260" cy="28" r="3" fill="#c084fc" opacity="0.4"/>
</svg>
